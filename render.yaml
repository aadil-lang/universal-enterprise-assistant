# 100% Free Tier Render Blueprint (No Credit Card Required)
version: "1"

databases:
  - name: acme-postgres
    databaseName: acme_assistant
    user: acme_app
    plan: free
    postgresMajorVersion: 16

services:
  # Unified Backend Web Service (FastAPI + FastMCP Engine)
  - type: web
    name: acme-api
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.render
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: acme-postgres
          property: connectionString
      - key: INTERNAL_MCP_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEMO_FISCAL_YEAR
        value: "2026"
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
