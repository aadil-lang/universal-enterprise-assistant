# Render Free Blueprint Specification for Universal Enterprise Assistant
# Single Free Web Service container co-locating FastAPI Gateway & Private FastMCP
version: "1"

services:
  - type: web
    name: acme-api
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.render
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_FISCAL_YEAR
        value: "2026"
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string
      - key: INTERNAL_MCP_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # Set to your Google AI Studio Gemini API Key
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: VECTOR_STORE_PROVIDER
        value: qdrant
      - key: QDRANT_URL
        sync: false # Set to your Qdrant Cloud cluster endpoint (e.g. https://xxx.gcp.cloud.qdrant.io:6333)
      - key: QDRANT_API_KEY
        sync: false # Set to your Qdrant Cloud API key
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
